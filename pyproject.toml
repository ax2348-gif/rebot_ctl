[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotarm-control-py"
version = "0.1.0"
description = "Control python for reBotArm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "meshcat>=0.3.2",
    "pin>=3.9.0",
    "numpy>=1.23.4",
    "pyyaml>=6.0",
    "matplotlib>=3.10.0",
    "motorbridge>=0.4.9",
]

# Command-line tools, on PATH whenever the venv is active.
[project.scripts]
rebot_setup = "reBotArm_control_py.cli.setup:main"
rebot_zero = "reBotArm_control_py.cli.zero:main"
rebot_zero_gripper = "reBotArm_control_py.cli.zero_gripper:main"
rebot_vis = "reBotArm_control_py.cli.vis:main"
rebot_jog = "reBotArm_control_py.cli.jog:main"

# Only the Python package is installed. config/ and urdf/ are read relative to the repo
# (reBotArm_control_py/actuator/rebotarm.py), so install it editable: pip install -e .
[tool.setuptools.packages.find]
include = ["reBotArm_control_py*"]
